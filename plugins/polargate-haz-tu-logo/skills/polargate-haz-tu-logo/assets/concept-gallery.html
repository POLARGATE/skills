<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo concepts</title>
<style>
  :root{
    --paper:#fafafa; --ink:#15171c; --muted:#71767f; --faint:#9aa0a8;
    --line:#e6e7ea; --card:#ffffff; --dark:#0e1014; --pill:#f1f2f4;
    --good:#1a7f37; --warn:#b25a00;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased;line-height:1.45}
  header{position:sticky;top:0;z-index:5;
    background:color-mix(in srgb,var(--paper) 86%,transparent);
    backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 30px}
  h1{font-size:15px;font-weight:600;letter-spacing:-0.01em;margin:0}
  h1 span{color:var(--muted);font-weight:400}
  .controls{display:flex;gap:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);
    font:inherit;font-size:12.5px;padding:7px 13px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  main{max-width:1200px;margin:0 auto;padding:30px 30px 90px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
  .card{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;
    display:flex;flex-direction:column}
  .stage{aspect-ratio:16/10;display:grid;place-items:center;transition:background .2s}
  .stage.bg-dark{background:var(--dark)} .stage.bg-light{background:var(--paper)}
  .mark{width:42%;max-width:150px;display:grid;place-items:center}
  .mark svg{width:100%;height:auto;display:block}
  .strip{display:flex;align-items:flex-end;gap:16px;padding:15px 18px;
    border-top:1px solid var(--line);flex-wrap:wrap}
  .s{display:grid;place-items:center;gap:6px}
  .s .box{display:grid;place-items:center}
  .s small{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
  /* in-context mockups */
  .ctx{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 18px;
    border-top:1px solid var(--line);align-items:end}
  .ctx figure{margin:0;display:grid;gap:7px;justify-items:center}
  .ctx figcaption{font-size:9.5px;color:var(--faint);letter-spacing:.02em}
  .tab{width:100%;height:30px;background:#ededf0;border-radius:8px 8px 0 0;
    display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #e2e2e6;border-bottom:0}
  .tab .fav{width:15px;height:15px;color:var(--ink);display:grid;place-items:center}
  .tab .ttl{height:6px;width:46%;background:#c9cace;border-radius:3px}
  .tile{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;
    background:var(--dark);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .tile .m{width:62%}
  .biz{width:100%;aspect-ratio:1.6/1;background:#fff;border:1px solid #e7e7ea;border-radius:6px;
    display:flex;align-items:flex-end;padding:8px}
  .biz .m{width:34%;color:var(--ink)}
  .sign{width:100%;aspect-ratio:1.6/1;background:#101216;border-radius:6px;
    display:grid;place-items:center;color:#fff}
  .sign .m{width:42%}
  .patch{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:#b9c2cc;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
  .patch .m{width:60%;color:#1b2733}
  .meta{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-size:14.5px;font-weight:600;letter-spacing:-0.01em}
  .pill{font-size:10.5px;color:var(--muted);background:var(--pill);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .rationale{font-size:12.5px;color:var(--muted);margin:0}
  .scores{display:flex;flex-wrap:wrap;gap:5px}
  .sc{font-size:10px;color:var(--muted);background:var(--pill);border-radius:6px;padding:2px 7px;
    font-variant-numeric:tabular-nums}
  .sc b{color:var(--ink);font-weight:600}
  .sc.low b{color:var(--warn)} .sc.hi b{color:var(--good)}
  .copy{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:9px;
    font:inherit;font-size:12px;color:var(--ink);padding:7px 11px;cursor:pointer;align-self:flex-start}
  .copy:hover{border-color:var(--muted)} .copy.ok{border-color:var(--good);color:var(--good)}
</style>
</head>
<body>
<header>
  <h1>Logo concepts <span id="brand"></span></h1>
  <div class="controls">
    <div class="seg" role="group" aria-label="Color mode">
      <button id="m-mono" aria-pressed="true">Mono</button>
      <button id="m-color" aria-pressed="false">Color</button>
    </div>
    <div class="seg" role="group" aria-label="Background">
      <button id="b-light" aria-pressed="true">Light</button>
      <button id="b-dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>
<main><div class="grid" id="grid"></div></main>

<script>
/* ============================================================
   FILL THIS. One object per surviving concept (post-critique).
   id        short slug
   name      concept name
   type      mark type (monogram, abstract, lettermark, ...)
   wordmark  OPTIONAL brand name for business-card / lockup mock
   rationale the single idea, one line
   scores    {distinctive,simple,scalable,relevant,memorable,timeless,versatile} 1..5
   svg       MONO version, fill/stroke = currentColor, viewBox 0 0 100 100
   colorSvg  OPTIONAL full-color version (own fills)
   Replace the two examples with the real survivors. Lead with the strongest.
   ============================================================ */
const BRAND = "";
const CONCEPTS = [
  {
    id:"ascent", name:"Ascent", type:"abstract", wordmark:"ASCENT",
    rationale:"An upward cut that reads as both motion and a peak.",
    scores:{distinctive:4,simple:5,scalable:5,relevant:4,memorable:4,timeless:4,versatile:5},
    svg:`<svg viewBox="0 0 100 100" role="img" aria-label="Ascent" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><title>Ascent</title><path d="M20 78 L50 22 L80 78 L63 78 L50 51 L37 78 Z"/></svg>`
  },
  {
    id:"aperture", name:"Aperture", type:"monoline", wordmark:"APERTURE",
    rationale:"An open ring: precision with a way in.",
    scores:{distinctive:4,simple:4,scalable:4,relevant:4,memorable:4,timeless:4,versatile:4},
    svg:`<svg viewBox="0 0 100 100" role="img" aria-label="Aperture" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg"><title>Aperture</title><path d="M50 13 a37 37 0 1 0 37 37"/></svg>`
  }
];

const state = { mode:"mono", bg:"light" };
const SCORE_KEYS = [["distinctive","Dist"],["simple","Smpl"],["scalable","Scl"],
  ["relevant","Rel"],["memorable","Mem"],["timeless","Tim"],["versatile","Ver"]];

function inkColor(){ return state.bg === "dark" ? "#ffffff" : "#15171c"; }
function markup(c){ return (state.mode==="color" && c.colorSvg) ? c.colorSvg : c.svg; }

function sizeRow(c){
  return `<div class="strip" style="color:${inkColor()}">` +
    [64,32,24,16].map(px =>
      `<div class="s"><div class="box" style="width:${px}px;height:${px}px">${c.svg}</div><small>${px}px</small></div>`
    ).join("") +
    `<div class="s" style="margin-left:auto"><small style="color:var(--faint)">squint &amp; favicon test</small></div></div>`;
}

function mockups(c){
  const wm = c.wordmark ? `<span style="font:600 7px/1 var(--font);letter-spacing:.12em;color:var(--ink);margin-left:6px">${c.wordmark}</span>` : "";
  return `<div class="ctx">
    <figure><div class="tab"><span class="fav">${c.svg}</span><span class="ttl"></span></div><figcaption>tab</figcaption></figure>
    <figure><div class="tile"><span class="m">${c.svg}</span></div><figcaption>app icon</figcaption></figure>
    <figure><div class="biz"><span class="m">${c.svg}</span>${wm}</div><figcaption>card</figcaption></figure>
    <figure><div class="sign"><span class="m">${c.svg}</span></div><figcaption>signage</figcaption></figure>
    <figure><div class="patch"><span class="m">${c.svg}</span></div><figcaption>embroidery</figcaption></figure>
  </div>`;
}

function scores(c){
  if(!c.scores) return "";
  return `<div class="scores">` + SCORE_KEYS.map(([k,lab])=>{
    const v = c.scores[k] ?? 0;
    const cls = v<=2 ? "low" : (v>=5 ? "hi" : "");
    return `<span class="sc ${cls}">${lab} <b>${v}</b></span>`;
  }).join("") + `</div>`;
}

function card(c){
  return `<div class="card">
    <div class="stage bg-${state.bg}" style="color:${inkColor()}"><div class="mark">${markup(c)}</div></div>
    ${sizeRow(c)}
    ${mockups(c)}
    <div class="meta">
      <div class="row"><span class="name">${c.name}</span><span class="pill">${c.type}</span></div>
      <p class="rationale">${c.rationale}</p>
      ${scores(c)}
      <button class="copy" data-id="${c.id}">Copy SVG</button>
    </div>
  </div>`;
}

function render(){
  document.getElementById("brand").textContent = BRAND ? "· " + BRAND : "";
  document.getElementById("grid").innerHTML = CONCEPTS.map(card).join("");
  document.querySelectorAll(".copy").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const c = CONCEPTS.find(x=>x.id===btn.dataset.id);
      const code = (state.mode==="color" && c.colorSvg) ? c.colorSvg : c.svg;
      try{ await navigator.clipboard.writeText(code);
        btn.textContent="Copied"; btn.classList.add("ok");
        setTimeout(()=>{btn.textContent="Copy SVG"; btn.classList.remove("ok");},1400);
      }catch(e){ btn.textContent="Copy failed"; }
    });
  });
}

function press(a,b,on){
  document.getElementById(a).setAttribute("aria-pressed", on?"true":"false");
  document.getElementById(b).setAttribute("aria-pressed", on?"false":"true");
}
function bind(id,fn){ document.getElementById(id).addEventListener("click",fn); }
bind("m-mono", ()=>{ state.mode="mono";  press("m-mono","m-color",true);  render(); });
bind("m-color",()=>{ state.mode="color"; press("m-mono","m-color",false); render(); });
bind("b-light",()=>{ state.bg="light"; press("b-light","b-dark",true);  render(); });
bind("b-dark", ()=>{ state.bg="dark";  press("b-light","b-dark",false); render(); });
render();
</script>
</body>
</html>
